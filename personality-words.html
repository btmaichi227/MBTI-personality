<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personality Words Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one centred column; a mode switch, then a game card (tap-to-match grid or one gap-fill sentence at a time) */
:root {
  --bg: #f3f4f8; --card: #ffffff; --ink: #1d1f2c; --muted: #5d6178; --line: #dfe1ea;
  --accent: #3f4bc4; --accent-ink: #ffffff;
  --good: #2e8b62; --good-bg: #e3f3eb; --bad: #c0392b; --bad-bg: #fbe9e7;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151d; --card: #1e2030; --ink: #eceef6; --muted: #a3a7bd; --line: #33364a;
    --accent: #8d97ff; --accent-ink: #14151d;
    --good: #5fc597; --good-bg: #183a2b; --bad: #ff8a7a; --bad-bg: #3e1f1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14151d; --card: #1e2030; --ink: #eceef6; --muted: #a3a7bd; --line: #33364a;
  --accent: #8d97ff; --accent-ink: #14151d;
  --good: #5fc597; --good-bg: #183a2b; --bad: #ff8a7a; --bad-bg: #3e1f1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px; }
.mode { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 12px; background: transparent; color: var(--muted); cursor: pointer; }
.mode[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mode:focus-visible, .tile:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stat { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat b { color: var(--ink); font-size: 16px; }
.prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.hint { margin: 0; color: var(--muted); font-size: 15px; }

/* match */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tile {
  font: inherit; text-align: left; width: 100%; min-height: 54px; padding: 10px 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  transition: border-color .15s, background .15s, opacity .3s, transform .1s;
}
.tile.word { font-family: var(--display); font-weight: 700; font-size: 17px; }
.tile.vn { font-size: 15px; }
.tile:hover { border-color: var(--accent); }
.tile.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.tile.ok { border-color: var(--good); background: var(--good-bg); cursor: default; opacity: .55; }
.tile.no { border-color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* fill */
.sentence { font-family: var(--display); font-weight: 600; font-size: clamp(20px, 4.4vw, 26px); line-height: 1.35; margin: 0; text-wrap: pretty; }
.gap { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--accent); color: var(--accent); text-align: center; padding: 0 4px; }
.gap.ok { color: var(--good); border-color: var(--good); }
.gap.no { color: var(--bad); border-color: var(--bad); }
.vnline { margin: 0; font-size: 14px; color: var(--muted); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { font: inherit; font-family: var(--display); font-weight: 700; font-size: 18px; padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.feedback { min-height: 24px; margin: 0; font-weight: 700; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }

.btn { font: inherit; font-weight: 700; border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 2px solid var(--line); background: transparent; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.done { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 14vw, 72px); line-height: 1; color: var(--accent); margin: 0; }
.review { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.review div { background: var(--bad-bg); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
@media (max-width: 420px) { .tile.word { font-size: 15px; } .tile.vn { font-size: 14px; } .opt { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Lesson 12 · Speaking Part 2 · Vocabulary</span>
    <h1>Personality Words</h1>
    <p class="sub">21 words to describe people. Match them with their meanings in simple English, then use them in sentences.</p>
  </header>

  <div class="modes" role="group" aria-label="Choose a game">
    <button class="mode" id="m-hard" type="button" aria-pressed="true">1 · Hard words</button>
    <button class="mode" id="m-match" type="button" aria-pressed="false">2 · Match all</button>
    <button class="mode" id="m-fill" type="button" aria-pressed="false">3 · Fill the gap</button>
  </div>

  <section class="card" id="game" aria-live="polite"></section>
  <p class="note">Play in order: 1 → 2 → 3.</p>
</div>

<script>
const W = [
  ["imaginative", "good at creating pictures and stories in your mind", "My little brother is very ___ – he makes up a new story every night."],
  ["inventive", "good at making new things or new ways to do things", "She is so ___ that she turned old bottles into a beautiful lamp."],
  ["visionary", "can see what the future will need and plans for it", "The ___ mayor started planning the city's metro 30 years ago."],
  ["strategic", "makes careful plans to reach a goal", "He is a ___ chess player who always thinks five moves ahead."],
  ["logical", "thinks clearly, using reasons and facts", "Try to be ___: check the facts before you make a decision."],
  ["intellectual", "loves thinking about difficult ideas", "My uncle is a very ___ person who reads books about science and philosophy."],
  ["curious", "always wants to know and learn more", "Young children are ___ and ask \"why?\" all the time."],
  ["bold", "not afraid to take risks", "Quitting her job to start a business was a ___ decision."],
  ["determined", "never gives up on a goal", "She is ___ to get IELTS 7.0, so she studies every single day."],
  ["tireless", "works very hard and never seems tired", "The ___ volunteers worked all night to help the flood victims."],
  ["leader", "a person who guides a group", "Everyone in the team listens to Nam – he is a natural ___."],
  ["outspoken", "says what they think, even if others don't like it", "My grandma is very ___ – she always says exactly what she thinks."],
  ["argumentative", "often disagrees and loves to argue", "Tom is so ___ that he disagrees with everything his parents say."],
  ["expressive", "shows feelings clearly on the face or in words", "The actor's face is very ___ – you can see every feeling on it."],
  ["reserved", "quiet and doesn't share feelings easily", "He is quite ___ and rarely talks about his feelings."],
  ["mystical", "a bit mysterious and hard to understand", "The old painter has a ___ smile – nobody knows what he is thinking."],
  ["poetic", "sees beauty everywhere and has deep feelings", "She writes ___ messages about the moon, the sea and the rain."],
  ["kind", "friendly and likes helping others", "It was very ___ of you to help me carry my heavy bags."],
  ["altruistic", "helps others without wanting anything back", "She gives half of her salary to charity – she is truly ___."],
  ["charismatic", "has a special charm that attracts people", "The ___ singer had the whole stadium singing along."],
  ["inspiring", "makes others want to do something good", "Her speech was so ___ that many students decided to volunteer."],
];
const GROUP = { imaginative:1, inventive:1, visionary:1, strategic:2, logical:2, intellectual:2, curious:2, bold:3, determined:3, tireless:3, leader:3, outspoken:4, argumentative:4, expressive:4, reserved:5, mystical:5, poetic:6, kind:6, altruistic:6, charismatic:7, inspiring:7 };
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let mode = "match";

/* ---------- MATCH ---------- */
const HARD = ["visionary", "inventive", "argumentative", "intellectual", "outspoken", "mystical", "altruistic", "charismatic", "expressive"];
let M;
function startMatch(hard) {
  if (hard) {
    M = { rounds: [shuffle(W.filter(w => HARD.includes(w[0])))], per: 9, total: 9, hard: true };
  } else {
    const order = shuffle(W);
    M = { rounds: [order.slice(0, 7), order.slice(7, 14), order.slice(14, 21)], per: 7, total: 21, hard: false };
  }
  Object.assign(M, { r: 0, sel: null, found: 0, mistakes: 0, t0: Date.now() });
  renderRound();
}
function renderRound() {
  const set = M.rounds[M.r];
  const words = shuffle(set), vns = shuffle(set);
  const total = M.r * M.per + M.found;
  $("game").innerHTML = `
    <div class="bar"><span class="stat">${M.hard ? "<b>9 hard words</b>" : `Round <b>${M.r + 1}</b> / 3`}</span><span class="stat">Matched <b>${total}</b> / ${M.total} · Mistakes <b>${M.mistakes}</b></span></div>
    <div class="prog"><i style="width:${total / M.total * 100}%"></i></div>
    <p class="hint">Tap a word, then tap its meaning.</p>
    <div class="board">
      <div class="col">${words.map(w => `<button type="button" class="tile word" data-k="${w[0]}" id="w-${w[0]}">${w[0]}</button>`).join("")}</div>
      <div class="col">${vns.map(w => `<button type="button" class="tile vn" data-k="${w[0]}" id="v-${w[0]}">${esc(w[1])}</button>`).join("")}</div>
    </div>`;
}
function matchClick(btn) {
  if (btn.classList.contains("ok")) return;
  const isWord = btn.classList.contains("word");
  if (!M.sel || M.sel.classList.contains("word") === isWord) {
    if (M.sel) M.sel.classList.remove("sel");
    M.sel = btn; btn.classList.add("sel"); return;
  }
  const a = M.sel, b = btn; M.sel = null; a.classList.remove("sel");
  if (a.dataset.k === b.dataset.k) {
    a.classList.add("ok"); b.classList.add("ok"); a.disabled = b.disabled = true;
    M.found++;
    const total = M.r * M.per + M.found;
    document.querySelector(".prog i").style.width = `${total / M.total * 100}%`;
    document.querySelectorAll(".stat")[1].innerHTML = `Matched <b>${total}</b> / ${M.total} · Mistakes <b>${M.mistakes}</b>`;
    if (M.found === M.per) setTimeout(() => { M.r++; M.found = 0; M.r < M.rounds.length ? renderRound() : matchDone(); }, 450);
  } else {
    M.mistakes++;
    [a, b].forEach(x => { x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 450); });
    document.querySelectorAll(".stat")[1].innerHTML = `Matched <b>${M.r * M.per + M.found}</b> / ${M.total} · Mistakes <b>${M.mistakes}</b>`;
  }
}
function matchDone() {
  const s = Math.round((Date.now() - M.t0) / 1000);
  $("game").innerHTML = `<div class="done">
    <span class="eyebrow">All ${M.total} words matched!</span>
    <p class="big">${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}</p>
    <p class="hint">Time · ${M.mistakes} mistake${M.mistakes === 1 ? "" : "s"}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn" type="button" id="again-m">↺ Play again</button>
      ${M.hard ? `<button class="btn primary" type="button" id="go-match">Next: Match all →</button>` : `<button class="btn primary" type="button" id="go-fill">Next: Fill the gap →</button>`}
    </div></div>`;
}

/* ---------- FILL ---------- */
let F;
function startFill() {
  F = { qs: shuffle(W), i: 0, score: 0, wrong: [], answered: false };
  renderFill();
}
function optionsFor(item) {
  const others = shuffle(W.filter(w => w[0] !== item[0] && GROUP[w[0]] !== GROUP[item[0]])).slice(0, 3).map(w => w[0]);
  return shuffle([item[0], ...others]);
}
function renderFill() {
  const item = F.qs[F.i]; F.answered = false;
  const [before, after] = item[2].split("___");
  $("game").innerHTML = `
    <div class="bar"><span class="stat">Question <b>${F.i + 1}</b> / 21</span><span class="stat">Score <b>${F.score}</b></span></div>
    <div class="prog"><i style="width:${F.i / 21 * 100}%"></i></div>
    <p class="sentence">${esc(before)}<span class="gap" id="gap">?</span>${esc(after)}</p>
    <div class="opts">${optionsFor(item).map(o => `<button type="button" class="opt" data-o="${o}" id="o-${o}">${o}</button>`).join("")}</div>
    <p class="feedback" id="fb"></p>
    <div class="bar"><span></span><button class="btn primary" type="button" id="next" hidden>${F.i < 20 ? "Next →" : "See my score"}</button></div>`;
}
function fillClick(btn) {
  if (F.answered) return;
  F.answered = true;
  const item = F.qs[F.i], right = btn.dataset.o === item[0];
  document.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (o.dataset.o === item[0]) o.classList.add("ok"); });
  const gap = $("gap"); gap.textContent = item[0];
  if (right) { F.score++; gap.classList.add("ok"); $("fb").className = "feedback ok"; $("fb").textContent = `Correct! ${item[0]} = ${item[1]}`; }
  else { btn.classList.add("no"); gap.classList.add("no"); F.wrong.push(item); $("fb").className = "feedback no"; $("fb").textContent = `Not quite – the answer is "${item[0]}" (${item[1]})`; }
  document.querySelector(".bar .stat:last-child").innerHTML = `Score <b>${F.score}</b>`;
  $("next").hidden = false; $("next").focus();
}
function fillDone() {
  $("game").innerHTML = `<div class="done">
    <span class="eyebrow">Your score</span>
    <p class="big">${F.score} / 21</p>
    <p class="hint">${F.score === 21 ? "Perfect! You know all the words." : F.score >= 15 ? "Great job! Check the words below." : "Good try! Look at these words again."}</p>
    ${F.wrong.length ? `<div class="review">${F.wrong.map(w => `<div><b>${w[0]}</b> – ${esc(w[1])}</div>`).join("")}</div>` : ""}
    <button class="btn primary" type="button" id="again-f">↺ Play again</button></div>`;
}

/* ---------- wiring ---------- */
function setMode(m) {
  mode = m;
  ["hard", "match", "fill"].forEach(k => $("m-" + k).setAttribute("aria-pressed", m === k));
  m === "fill" ? startFill() : startMatch(m === "hard");
}
$("m-hard").addEventListener("click", () => setMode("hard"));
$("m-match").addEventListener("click", () => setMode("match"));
$("m-fill").addEventListener("click", () => setMode("fill"));
$("game").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.classList.contains("tile")) return matchClick(t);
  if (t.classList.contains("opt")) return fillClick(t);
  if (t.id === "next") { F.i++; F.i < 21 ? renderFill() : fillDone(); return; }
  if (t.id === "again-m") return startMatch(M.hard);
  if (t.id === "go-match") return setMode("match");
  if (t.id === "go-fill") return setMode("fill");
  if (t.id === "again-f") return startFill();
});
setMode("hard");
</script>
</html>
